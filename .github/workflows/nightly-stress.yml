name: Nightly stress test

on:
  schedule:
    - cron: "0 8 * * *" # 03:00 US Central (CDT)
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A new seed every night, recorded in the run so failures can be reproduced.
      - name: Stress test (10,000 games)
        run: pnpm stress --games 10000 --seed nightly-$(date -u +%Y%m%d)

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: stress-failures
          path: |
            stress-failures/
            loop-reports/
          if-no-files-found: ignore
          retention-days: 30
