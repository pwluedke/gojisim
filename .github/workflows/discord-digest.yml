name: Discord digest

# #140, #148: every 15 minutes, all day (Paul, Nov 13; was hourly in the day), the GojiSim Discord server's COMMUNITY channels (and their threads)
# go to Slack #gojisim-discord-digest, read with Paul's bot. The window is the last 3 hours plus a
# 10-minute overlap, and the Discord message ids already posted (kept in the Actions cache, no
# commits) are never posted twice. Never STAFF or INFO, never a post to Discord. The repo is
# public: the log shows counts only (docs/discord.md).
on:
  schedule:
    # Every 15 minutes, all day (Paul, Nov 13), so the hourly bug watch at :25 Central sees
    # Discord replies within about an hour. The 3-hour window and the posted-id cache stay, so a
    # late or skipped run loses nothing and nothing is posted twice.
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours back to read (1 to 336); already-posted messages are skipped"
        required: false
        default: "3"

concurrency:
  group: discord-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    name: Discord digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The ids the last run posted: the newest cache whose key starts with the prefix.
      - name: Restore the posted ids
        uses: actions/cache/restore@v6
        with:
          path: .digest-seen.json
          key: discord-digest-seen-${{ github.run_id }}
          restore-keys: discord-digest-seen-

      - name: Post the digest
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          SLACK_DIGEST_WEBHOOK: ${{ secrets.SLACK_DIGEST_WEBHOOK }}
          HOURS: ${{ inputs.hours || '3' }}
        run: pnpm discord-digest --hours "$HOURS" --overlap-minutes 10 --seen .digest-seen.json

      # Saved even after a failed post, so ids from digests that went out stay seen.
      - name: Save the posted ids
        if: always() && hashFiles('.digest-seen.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .digest-seen.json
          key: discord-digest-seen-${{ github.run_id }}
