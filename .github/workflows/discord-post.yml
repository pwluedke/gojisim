name: Discord post

# Paul posts to the GojiSim Discord's #bugs channel through its webhook (secret
# `DISCORD_BUGS_WEBHOOK`). Run by hand only: Actions → Discord post → Run workflow. Only the user
# ids in `mentions` can be pinged, never @everyone or roles. The new message's id goes to the run
# summary, so `edit_id` can edit it later. The repo is public: the log shows only the HTTP status
# and the message id, never the text or the webhook URL (docs/discord.md, `pnpm discord-post`).
on:
  workflow_dispatch:
    inputs:
      message:
        description: "The message (up to 2000 characters). Tag a user as <@id>"
        required: true
      reply_to:
        description: "Optional: the id of the #bugs message this answers (posted as a link to it)"
        required: false
        default: ""
      mentions:
        description: "Optional: comma-separated Discord user ids the message tags (only they are pinged)"
        required: false
        default: ""
      edit_id:
        description: "Optional: the id of a message this webhook posted, to edit it instead of posting"
        required: false
        default: ""

concurrency:
  group: discord-post
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    name: Post to #bugs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Post
        env:
          DISCORD_BUGS_WEBHOOK: ${{ secrets.DISCORD_BUGS_WEBHOOK }}
          MESSAGE: ${{ inputs.message }}
          REPLY_TO: ${{ inputs.reply_to }}
          MENTIONS: ${{ inputs.mentions }}
          EDIT_ID: ${{ inputs.edit_id }}
        run: |
          # The URL is never printed; masked in case a tool does.
          if [ -n "$DISCORD_BUGS_WEBHOOK" ]; then echo "::add-mask::$DISCORD_BUGS_WEBHOOK"; fi
          pnpm -s discord-post
