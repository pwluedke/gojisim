name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Speed guard: fails if applyAction or getLegalActions is more than 50 % over
      # bench/baseline.json (median of fixed EBP01/EBP02 games, in calibration units). An accepted
      # slowdown updates the baseline in its PR: `pnpm bench --update-baseline`.
      - name: Speed guard
        run: pnpm bench --check

      # Spec case 52: random legal games with invariant checks. Seeded by the commit, so a
      # failure can be reproduced with `pnpm stress --games 1000 --seed <sha>`.
      - name: Stress test (1,000 games)
        run: pnpm stress --games 1000 --seed ${{ github.sha }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: stress-failures
          path: |
            stress-failures/
            loop-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Playwright Chromium
        run: pnpm --filter @gojisim/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
