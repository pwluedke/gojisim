name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request cancels its older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks run as parallel jobs; `ci` at the end passes only when every one of them passed, so
# it is the one check branch protection needs.
jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Test
        run: pnpm test

  speed-guard:
    name: Build and speed guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      # Speed guard: fails if applyAction or getLegalActions is more than 50 % over
      # bench/baseline.json (median of fixed EBP01/EBP02 games, in calibration units). An accepted
      # slowdown updates the baseline in its PR: `pnpm bench --update-baseline`.
      - name: Speed guard
        run: pnpm bench --check

  stress:
    name: Stress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Spec case 52: random legal games with invariant checks, seeded by the commit, so a failure
      # can be reproduced with `pnpm stress --games <n> --seed <sha>`. 200 games on a pull request,
      # 1,000 on a push to main; the nightly run plays 10,000 uniform and 4,500 weighted.
      - name: Stress test
        run: pnpm stress --games ${{ github.event_name == 'push' && 1000 || 200 }} --seed ${{ github.sha }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: stress-failures
          path: |
            stress-failures/
            loop-reports/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Microsoft's Playwright image already holds Chromium and its system libraries, so nothing is
    # installed from Ubuntu's apt mirror. The tag must match the lockfile's Playwright version
    # (checked by apps/web/src/playwrightImage.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: E2E
        run: pnpm --filter @gojisim/web exec playwright test --shard=${{ matrix.shard }}/3

      # Each shard keeps a blob report; `e2e-report` merges them when a shard fails.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 1

  e2e-report:
    name: E2E report
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          path: apps/web/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge the shards' reports
        working-directory: apps/web
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  ci:
    name: ci
    needs: [lint-typecheck, unit, speed-guard, stress, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "A check did not pass: ${{ toJSON(needs) }}"
          exit 1

      - name: All checks passed
        run: echo "Every check passed."
